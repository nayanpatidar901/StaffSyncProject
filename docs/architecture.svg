<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">StaffSync technical architecture</title>
  <desc id="desc">A browser frontend communicates with an Express and Node API, which uses Mongoose to access MongoDB Atlas. Render hosts the Node service.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#167451"/></marker><style>.title{font:700 28px Arial;fill:#19231f}.sub{font:14px Arial;fill:#718078}.box{fill:#fff;stroke:#dce5de;stroke-width:2;rx:18}.head{font:700 19px Arial;fill:#19231f}.txt{font:14px Arial;fill:#65736a}.tag{font:12px Arial;fill:#167451}.arrow{stroke:#167451;stroke-width:3;fill:none;marker-end:url(#arrow)}.note{font:13px Arial;fill:#637069}</style></defs>
  <rect width="1120" height="600" fill="#f6f7f4" rx="24"/>
  <text class="title" x="56" y="62">StaffSync · Technical architecture</text><text class="sub" x="56" y="88">Single Node.js web service · same-origin JSON API · MongoDB Atlas</text>
  <rect class="box" x="56" y="170" width="270" height="250"/><text class="tag" x="82" y="208">CLIENT</text><text class="head" x="82" y="244">Browser</text><text class="txt" x="82" y="278">public/index.html</text><text class="txt" x="82" y="304">Embedded CSS styles</text><text class="txt" x="82" y="330">public/app.js</text><text class="txt" x="82" y="356">DOM + Fetch API</text><text class="txt" x="82" y="382">Overview and HR modules</text>
  <rect class="box" x="423" y="150" width="315" height="290"/><text class="tag" x="451" y="190">APPLICATION · RENDER WEB SERVICE</text><text class="head" x="451" y="228">Node.js + Express</text><text class="txt" x="451" y="264">Static frontend hosting</text><text class="txt" x="451" y="292">REST-style /api routes</text><text class="txt" x="451" y="320">Validation + error handling</text><text class="txt" x="451" y="348">Mongoose model operations</text><text class="txt" x="451" y="387">backend/server.js</text>
  <rect class="box" x="835" y="170" width="230" height="250"/><text class="tag" x="861" y="208">DATA</text><text class="head" x="861" y="244">MongoDB Atlas</text><text class="txt" x="861" y="278">Employee</text><text class="txt" x="861" y="304">LeaveRequest</text><text class="txt" x="861" y="330">Attendance</text><text class="txt" x="861" y="356">Announcement</text><text class="txt" x="861" y="382">Training</text>
  <path class="arrow" d="M326 250H410"/><text class="note" x="337" y="235">HTTPS · JSON</text><path class="arrow" d="M423 335H339"/><text class="note" x="343" y="357">JSON response</text>
  <path class="arrow" d="M738 250H822"/><text class="note" x="750" y="235">Mongoose</text><path class="arrow" d="M835 335H751"/><text class="note" x="758" y="357">Documents</text>
  <rect x="56" y="478" width="1009" height="76" rx="14" fill="#e7f3ec"/><text x="82" y="509" style="font:700 15px Arial;fill:#167451">Authentication</text><text x="82" y="533" style="font:13px Arial;fill:#40594a">JWT session in an HTTP-only cookie; bcrypt password hashes; API role checks. React is not used.</text>
</svg>
