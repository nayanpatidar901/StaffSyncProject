<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">StaffSync entity relationship diagram</title><desc id="desc">Users link to one employee profile. Employee has many attendance records and leave requests. Training and announcements are standalone collections.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#167451"/></marker><style>.title{font:700 28px Arial;fill:#19231f}.sub{font:14px Arial;fill:#718078}.entity{fill:#fff;stroke:#dce5de;stroke-width:2;rx:15}.eh{font:700 17px Arial;fill:#167451}.f{font:13px Arial;fill:#334239}.hint{font:12px Arial;fill:#7b8980}.rel{stroke:#167451;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.label{font:12px Arial;fill:#52635a}</style></defs>
  <rect width="1120" height="690" fill="#f6f7f4" rx="24"/><text class="title" x="56" y="62">StaffSync · Data model (MongoDB)</text><text class="sub" x="56" y="89">Six collections · ObjectId references · users connect to employee profiles.</text>
  <rect class="entity" x="70" y="105" width="270" height="84"/><text class="eh" x="96" y="137">User</text><text class="f" x="96" y="163">email · passwordHash · role · employee (FK)</text>
  <rect class="entity" x="70" y="205" width="270" height="280"/><text class="eh" x="96" y="241">Employee</text><text class="f" x="96" y="278">_id · ObjectId (PK)</text><text class="f" x="96" y="307">name · String</text><text class="f" x="96" y="336">email · String (unique)</text><text class="f" x="96" y="365">department · String</text><text class="f" x="96" y="394">role · String</text><text class="f" x="96" y="423">location · String</text><text class="f" x="96" y="452">status · Enum</text>
  <rect class="entity" x="450" y="125" width="280" height="230"/><text class="eh" x="476" y="161">LeaveRequest</text><text class="f" x="476" y="198">_id · ObjectId (PK)</text><text class="f" x="476" y="227">employee · ObjectId (FK)</text><text class="f" x="476" y="256">type · Enum</text><text class="f" x="476" y="285">startDate · endDate</text><text class="f" x="476" y="314">status · Enum</text>
  <rect class="entity" x="450" y="405" width="280" height="230"/><text class="eh" x="476" y="441">Attendance</text><text class="f" x="476" y="478">_id · ObjectId (PK)</text><text class="f" x="476" y="507">employee · ObjectId (FK)</text><text class="f" x="476" y="536">date · Date</text><text class="f" x="476" y="565">checkIn · checkOut</text><text class="f" x="476" y="594">status · Enum</text>
  <rect class="entity" x="825" y="160" width="235" height="190"/><text class="eh" x="851" y="197">Announcement</text><text class="f" x="851" y="234">_id · ObjectId (PK)</text><text class="f" x="851" y="263">title · body</text><text class="f" x="851" y="292">audience · author</text><text class="f" x="851" y="321">publishedAt · Date</text>
  <rect class="entity" x="825" y="410" width="235" height="190"/><text class="eh" x="851" y="447">Training</text><text class="f" x="851" y="484">_id · ObjectId (PK)</text><text class="f" x="851" y="513">title · category</text><text class="f" x="851" y="542">modules · learners</text><text class="f" x="851" y="571">progress · status</text>
  <path class="rel" d="M340 300H432"/><text class="label" x="352" y="287">1 : many</text><path class="rel" d="M340 430H432"/><text class="label" x="352" y="417">1 : many</text>
  <path class="rel" d="M205 189V198"/><text class="label" x="220" y="199">1 : 1</text>
  <text class="hint" x="70" y="530">PK = document _id</text><text class="hint" x="70" y="551">FK = ObjectId reference</text><text class="hint" x="70" y="582">Attendance has a unique employee + date index.</text>
</svg>
