services:
  - type: web
    name: staffsync
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: HR_REGISTRATION_CODE
        generateValue: true
      - key: MANAGER_REGISTRATION_CODE
        generateValue: true
      - key: NODE_ENV
        value: production
